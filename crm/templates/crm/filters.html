<form class="filter-bar" method="get"><label class="search-box"><span>⌕</span><input type="search" name="q" value="{{ request.GET.q }}" placeholder="Buscar registros…" aria-label="Buscar registros"></label>{% for filter in filters %}<select name="{{ filter.name }}" aria-label="{{ filter.label }}"><option value="">{{ filter.label }}</option>{% for value,label in filter.values %}<option value="{{ value }}" {% if filter.selected == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% endfor %}<button class="button subtle">Filtrar</button><a class="text-link" href="/{{ module }}/">Limpar</a><details class="advanced-filter"><summary>Filtros avançados</summary><div><label>Desde <input type="date" name="start" value="{{ request.GET.start }}"></label><label>Até <input type="date" name="end" value="{{ request.GET.end }}"></label>{% if module == 'leads' or module == 'sales' or module == 'variants' %}<label>Valor mínimo <input type="number" name="min" value="{{ request.GET.min }}" min="0" step="0.01"></label><label>Valor máximo <input type="number" name="max" value="{{ request.GET.max }}" min="0" step="0.01"></label>{% endif %}{% if module == 'leads' %}<label>Cidade <input name="city" value="{{ request.GET.city }}"></label><label><input type="checkbox" name="stale" value="1" {% if request.GET.stale %}checked{% endif %}> Parados há 3 dias</label>{% endif %}<button class="button primary">Aplicar filtros</button></div></details></form>
