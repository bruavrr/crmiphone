services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: premiumcrm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha PostgreSQL segura}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d premiumcrm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DEBUG: "false"
      DB_SSLMODE: disable
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
  automations:
    build: .
    env_file: .env
    environment:
      DEBUG: "false"
      DB_SSLMODE: disable
    command: ["python", "manage.py", "automation_worker"]
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  media:
